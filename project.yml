# XcodeGen 工程定义 —— 无 Mac 工作流的核心：
# .xcodeproj 由本文件在云端 macOS（GitHub Actions）上生成，Windows 侧只维护文本。
# 本机修改后无需 Xcode：push 后 CI 自动 xcodegen + 编译验证 App 与 Widget。
name: CT
options:
  bundleIdPrefix: com.ctapp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MacroCore:
    path: .

targets:
  CTApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/CTApp
    dependencies:
      - package: MacroCore
        product: MacroCore
      - target: CTWidget        # 内嵌 Widget Extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctapp.CT
        INFOPLIST_FILE: Sources/CTApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/CTApp/CT.entitlements
        # TODO(P1): 实机分发时配置签名（App Groups 标识需换成你 Team ID 前缀）：
        #   CODE_SIGN_STYLE: Automatic
        #   DEVELOPMENT_TEAM: <你的 Team ID>
        #   group.com.ctapp.shared → group.<TEAMID>.ctapp.shared（三处：两处 entitlements + SwiftDataModels.swift）

  CTWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/CTWidget
    dependencies:
      - package: MacroCore
        product: MacroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctapp.CT.widget
        INFOPLIST_FILE: Sources/CTWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/CTWidget/CTWidget.entitlements
