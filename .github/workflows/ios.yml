# 无 Mac 工作流：push 到 GitHub 后，云端 macOS 自动完成
# 工程生成（xcodegen）→ App+Widget 模拟器编译 → 核心库单元测试。
# 失败时把错误行以 ::error:: 输出，转为公开可读的 check 注解，便于远程诊断。
name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-app:
    name: 编译 App + Widget（模拟器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 .xcodeproj
        shell: bash
        run: |
          set +e
          xcodegen --version > gen.out 2>&1
          echo "::notice::xcodegen --version exit=${PIPESTATUS[0]} output: $(head -c 200 gen.out | tr -d '\r')"
          xcodegen --spec project.yml > gen.out 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::xcodegen exit=$status, 输出尾部："
            tail -40 gen.out | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            exit 1
          fi

      - name: 编译
        shell: bash
        run: |
          set +e
          xcodebuild -scheme CTApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build > build.out 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "error:" build.out | head -40 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            echo "::error::---- 上下文（最后 25 行）----"
            tail -25 build.out | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            exit 1
          fi

  test-core:
    name: MacroCore 单元测试
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: swift test
        shell: bash
        run: |
          set +e
          swift test > test.out 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            grep -E "error:" test.out | head -40 | tr -d '\r' | sed 's/%/%25/g' | while IFS= read -r line; do
              echo "::error::${line:0:300}"
            done
            exit 1
          fi
